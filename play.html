<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Neon Moss Studio</title>
<meta name="theme-color" content="#0b0e12">
<link rel="icon" href="assets/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body class="play-page">
<div class="grid-bg" aria-hidden="true"></div>

<header class="nav">
  <a class="nav-brand" href="./" aria-label="Neon Moss Studio">
    <img src="assets/logo-header.webp" alt="Neon Moss" width="591" height="144">
  </a>
  <nav class="nav-links">
    <a href="./#games" id="backLink">← Games</a>
  </nav>
</header>

<main class="play-wrap">
  <div class="play-head">
    <h1 id="gTitle">…</h1>
    <div class="tags" id="gTags"></div>
  </div>

  <div class="frame" id="frame">
    <iframe id="game" title="Game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
    <button class="start" id="start" type="button">
      <img id="startCover" alt="">
      <span class="start-shade"></span>
      <span class="start-btn" id="startLabel">Play demo</span>
      <span class="start-note" id="startNote"></span>
    </button>
  </div>

  <div class="play-bar">
    <ul class="keys" id="keys"></ul>
    <button class="btn btn-ghost btn-sm" id="fsBtn" type="button">Fullscreen</button>
  </div>

  <section class="dl-box" id="dlBox" hidden>
    <div class="dl-text">
      <b id="dlTitle"></b>
      <p id="dlInfo"></p>
      <p class="dl-small" id="dlSmall"></p>
    </div>
    <div class="dl-act">
      <a class="btn btn-lime" id="dlBtn" hidden></a>
      <span class="btn btn-off" id="dlSoon"></span>
      <span class="dl-count" id="dlCount" hidden></span>
    </div>
  </section>

  <p class="play-desc" id="gDesc"></p>

  <section class="about-game" id="aboutBox" hidden>
    <p class="ag-tag" id="agTag"></p>
    <p class="ag-intro" id="agIntro"></p>
    <div id="agRows"></div>
    <div class="ag-feat" id="agFeatBox">
      <h2 id="agFeatTitle"></h2>
      <ul id="agFeat"></ul>
    </div>
  </section>

  <section class="shots" id="shotsBox" hidden>
    <h2 id="shotsTitle">Screenshots</h2>
    <div class="shots-grid" id="shotsGrid"></div>
  </section>

  <section class="press" id="pressBox" hidden>
    <h2 id="pressTitle"></h2>
    <p id="pressText"></p>
  </section>
</main>

<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lbX" type="button" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next">›</button>
</div>

<footer class="foot">
  <span>© <span id="year"></span> Neon Moss Studio</span>
  <a href="./">neonmoss</a>
</footer>

<script src="js/games.js?v=7"></script>
<script>
(function () {
  "use strict";
  var T = {
    pl: { back: "← Gry", play: "Zagraj w demo", fs: "Pełny ekran", note: "Ok. 120 MB do pobrania. Dźwięk startuje po kliknięciu.", missing: "Nie ma takiej gry.",
          dlT: "Chcesz pełną jakość?", dlI: "Wersja w przeglądarce ma słabszą grafikę i dźwięk i może lekko przycinać. Pobierz wersję na Windows: jeden plik .exe, bez instalacji. Rozpakuj i graj.",
          dlS: "Windows może pokazać ostrzeżenie SmartScreen, bo gra nie ma podpisu. Kliknij „Więcej informacji”, potem „Uruchom mimo to”.",
          dlB: "Pobierz na Windows", dlSoon: "Wersja na Windows wkrótce", dlC: "pobrań", shots: "Zrzuty ekranu", feat: "Co znajdziesz w grze",
          pressT: "Streamer albo prasa?", pressX: "Chcesz pokazać grę na kanale albo napisać o niej? Napisz do nas: " },
    en: { back: "← Games", play: "Play demo", fs: "Fullscreen", note: "About 120 MB to download. Sound starts after you click.", missing: "Game not found.",
          dlT: "Want full quality?", dlI: "The browser version has lower quality graphics and sound and may stutter a bit. Get the Windows version: a single .exe, no install. Unzip and play.",
          dlS: "Windows may show a SmartScreen warning because the game is not signed. Click “More info”, then “Run anyway”.",
          dlB: "Download for Windows", dlSoon: "Windows version coming soon", dlC: "downloads", shots: "Screenshots", feat: "Features",
          pressT: "Streamer or press?", pressX: "Want to cover the game on your channel or website? Write to us: " }
  };
  var lang;
  try { lang = localStorage.getItem("nm_lang"); } catch (e) {}
  if (lang !== "pl" && lang !== "en") lang = (navigator.language || "en").toLowerCase().indexOf("pl") === 0 ? "pl" : "en";
  var t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("backLink").textContent = t.back;
  document.getElementById("fsBtn").textContent = t.fs;

  var slug = new URLSearchParams(location.search).get("g");
  var g = (window.NM_GAMES || []).filter(function (x) { return x.slug === slug && x.play; })[0];
  if (!g) { document.getElementById("gTitle").textContent = t.missing; document.getElementById("frame").style.display = "none"; return; }

  document.title = g.title + " · Neon Moss Studio";
  document.getElementById("gTitle").textContent = g.title;
  document.body.setAttribute("data-accent", g.accent || "lime");
  var tags = document.getElementById("gTags");
  (g.tags || []).concat(g.engine ? [g.engine] : []).forEach(function (x) { var s = document.createElement("span"); s.textContent = x; tags.appendChild(s); });
  var d = g.desc || {};
  document.getElementById("gDesc").textContent = d[lang] || d.pl || d.en || "";

  var keys = document.getElementById("keys");
  (g.controls || []).forEach(function (c) {
    var li = document.createElement("li");
    var k = document.createElement("kbd"); k.textContent = c.k;
    var s = document.createElement("span"); s.textContent = c[lang] || c.en || "";
    li.appendChild(k); li.appendChild(s); keys.appendChild(li);
  });

  if (g.release) {
    document.getElementById("dlBox").hidden = false;
    document.getElementById("dlTitle").textContent = t.dlT;
    document.getElementById("dlInfo").textContent = t.dlI;
    document.getElementById("dlSmall").textContent = t.dlS;
    var soon = document.getElementById("dlSoon");
    soon.textContent = t.dlSoon;
    window.NM_release(g, function (r) {
      if (!r) return;
      var b = document.getElementById("dlBtn");
      b.href = r.url; b.textContent = t.dlB; b.hidden = false;
      soon.remove();
      var c = document.getElementById("dlCount");
      c.textContent = r.count + " " + t.dlC; c.hidden = false;
    });
  }

  // galeria: miniatury (g.shots[i].thumb) i pełne zrzuty (g.shots[i].full) w lightboxie
  var shotDir = "assets/games/" + g.slug + "/shots/";
  var shots = (g.shots || []).map(function (n) { return { thumb: shotDir + n + "_t.webp", full: shotDir + n + ".webp" }; });
  if (shots.length) {
    document.getElementById("shotsBox").hidden = false;
    document.getElementById("shotsTitle").textContent = t.shots;
    var grid = document.getElementById("shotsGrid");
    var lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), cur = 0;
    var show = function (i) {
      cur = (i + shots.length) % shots.length;
      lbImg.src = shots[cur].full; lbImg.alt = g.title;
      lb.hidden = false; document.body.style.overflow = "hidden";
    };
    var hide = function () { lb.hidden = true; document.body.style.overflow = ""; };
    window.NM_showShot = show;
    shots.forEach(function (sh, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "shot";
      var im = document.createElement("img");
      im.src = sh.thumb; im.alt = g.title; im.loading = "lazy";
      b.appendChild(im);
      b.addEventListener("click", function () { show(i); });
      grid.appendChild(b);
    });
    document.getElementById("lbX").addEventListener("click", hide);
    document.getElementById("lbPrev").addEventListener("click", function (e) { e.stopPropagation(); show(cur - 1); });
    document.getElementById("lbNext").addEventListener("click", function (e) { e.stopPropagation(); show(cur + 1); });
    lb.addEventListener("click", function (e) { if (e.target === lb) hide(); });
    document.addEventListener("keydown", function (e) {
      if (lb.hidden) return;
      if (e.key === "Escape") hide();
      else if (e.key === "ArrowLeft") show(cur - 1);
      else if (e.key === "ArrowRight") show(cur + 1);
    });
  }

  // opis gry (g.about) z sekcjami i zrzutami obok
  var ab = g.about && (g.about[lang] || g.about.en || g.about.pl);
  if (ab) {
    document.getElementById("aboutBox").hidden = false;
    document.getElementById("agTag").textContent = ab.tagline || "";
    document.getElementById("agIntro").textContent = ab.intro || "";
    var rows = document.getElementById("agRows");
    (ab.sections || []).forEach(function (sec, i) {
      var row = document.createElement("article");
      row.className = "ag-row" + (i % 2 ? " flip" : "");
      var txt = document.createElement("div"); txt.className = "ag-txt";
      var h = document.createElement("h2"); h.textContent = sec.title; txt.appendChild(h);
      if (sec.text) { var pp = document.createElement("p"); pp.textContent = sec.text; txt.appendChild(pp); }
      if (sec.bullets) {
        var ul = document.createElement("ul");
        sec.bullets.forEach(function (b) { var li = document.createElement("li"); li.textContent = b; ul.appendChild(li); });
        txt.appendChild(ul);
      }
      row.appendChild(txt);
      var idx = (sec.shot || 0) - 1;
      if (g.shots && g.shots[idx]) {
        var fig = document.createElement("button"); fig.type = "button"; fig.className = "ag-img";
        var im = document.createElement("img");
        im.src = "assets/games/" + g.slug + "/shots/" + g.shots[idx] + ".webp"; im.alt = sec.title; im.loading = "lazy";
        fig.appendChild(im);
        fig.addEventListener("click", function () { if (window.NM_showShot) window.NM_showShot(idx); });
        row.appendChild(fig);
      }
      rows.appendChild(row);
    });
    var fl = document.getElementById("agFeat");
    document.getElementById("agFeatTitle").textContent = t.feat;
    (ab.features || []).forEach(function (f) { var li = document.createElement("li"); li.textContent = f; fl.appendChild(li); });
    if (!(ab.features || []).length) document.getElementById("agFeatBox").remove();
  }
  var mail = (window.NM_SITE || {}).email;
  if (mail) {
    document.getElementById("pressBox").hidden = false;
    document.getElementById("pressTitle").textContent = t.pressT;
    var pt = document.getElementById("pressText");
    pt.textContent = t.pressX;
    var ma = document.createElement("a"); ma.href = "mailto:" + mail; ma.textContent = mail; pt.appendChild(ma);
  }

  var start = document.getElementById("start");
  var cover = document.getElementById("startCover");
  if (g.cover) { cover.src = g.cover; cover.alt = g.title; } else { cover.remove(); }
  document.getElementById("startLabel").textContent = t.play;
  document.getElementById("startNote").textContent = t.note;

  var frame = document.getElementById("frame");
  var game = document.getElementById("game");
  // Gra laduje sie dopiero po kliknieciu: nie pobiera 120 MB od razu,
  // a klikniecie odblokowuje dzwiek w przegladarce.
  start.addEventListener("click", function () {
    game.src = g.play + (g.play.slice(-1) === "/" ? "index.html" : "");
    start.remove();
    frame.classList.add("on");
    game.focus();
    game.addEventListener("load", function () { game.focus(); });
  });
  frame.addEventListener("click", function () { game.focus(); });

  document.getElementById("fsBtn").addEventListener("click", function () {
    var el = frame;
    var rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq) rq.call(el);
    game.focus();
  });
})();
</script>
</body>
</html>
